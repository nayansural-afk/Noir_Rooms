name: Noir Rooms — Cinema News

on:
  schedule:
    # Every hour (UTC). One post per run.
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: noir-rooms
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Noir Rooms
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CHANNEL_ID: "@noir_rooms"
          POSTS_PER_RUN: "1"
          CANDIDATE_LIMIT: "40"
          PUBLISH_LIMIT: "1"
          MAX_AI_ATTEMPTS: "4"
          MIN_INTEREST_SCORE: "58"
          # Optional one-shot channel branding (leave empty after first success):
          # SET_CHANNEL_TITLE: "Noir Rooms | اخبار سینما"
          # SET_CHANNEL_DESCRIPTION: "اخبار فیلم، سریال، بازیگران و باکس‌آفیس — برای علاقه‌مندان سینما"
        run: python noir_rooms_bot.py

      - name: Commit history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add news_history.json
          git diff --staged --quiet || git commit -m "chore: update Noir Rooms history"
          git push
